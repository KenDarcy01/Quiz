<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Watch · Family Quiz</title>
  <meta name="description" content="Follow a Family Quiz game live.">
  <meta name="theme-color" content="#EEE7FF">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-live="polite"><div class="pass"><h1>Loading…</h1></div></main>
  <script src="js/supabase.js"></script>
  <script>
    // Watch a game without the app or an account: polls watch_game() with the game's watch key.
    const WATCH_POLL_MS = 2000;
    const COLOURS = ['var(--cyan)', 'var(--pink)', 'var(--lime)', 'var(--orange)'];
    const app = document.getElementById('app');
    const key = new URLSearchParams(location.search).get('k') || '';

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function watchGame() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/watch_game`, {
        method: 'POST',
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_key: key }),
        cache: 'no-store',
      });
      if (!res.ok) throw new Error(`error ${res.status}`);
      return res.json();
    }

    function scoreboard(players, highlight) {
      const sorted = players.slice().sort((a, b) => b.score - a.score);
      return `<ol class="stack" style="list-style:none;margin:0;padding:0;gap:8px">
        ${sorted.map((p, i) => `
          <li class="card leader ${i === 0 && p.score > 0 ? 'first' : ''}" style="padding:8px 12px${p.id === highlight ? ';outline:4px solid var(--orange)' : ''}">
            <span class="rank">${i + 1}</span>
            <div class="badge" style="background:${COLOURS[players.indexOf(p) % 4]}" aria-hidden="true">${players.indexOf(p) + 1}</div>
            <span class="player-name">${esc(p.name)}${p.streak >= 3 ? ` <span class="muted" style="font-size:13px">🔥 ${p.streak}</span>` : ''}</span>
            <span class="score">${p.score}</span>
          </li>`).join('')}
      </ol>`;
    }

    const GAMES = {
      penalties: { name: 'Penalty shootout', icon: '⚽', hit: '⚽', miss: '🧤' },
      hoops: { name: 'Basketball', icon: '🏀', hit: '🏀', miss: '❌' },
      moles: { name: 'Whack-a-mole', icon: '🔨', hit: '🐹', miss: '○' },
      wheel: { name: 'Prize wheel', icon: '🎡', hit: '⭐', miss: '○' },
    };
    const gameOf = (name) => GAMES[name] || GAMES.penalties;
    const nameOf = (g, id) => esc((g.players.find((p) => p.id === id) || {}).name || '');

    // A streak bonus being played, or how it went.
    function bonusView(g) {
      const b = g.bonus;
      if (!b) return '';
      const game = gameOf(b.game);
      const tally = [0, 1, 2].map((i) => b.kicks[i] ? (b.kicks[i].goal ? game.hit : game.miss) : '○').join(' ');
      return `<div class="card stack" style="gap:6px">
        <span class="eyebrow">🔥 ${nameOf(g, b.player_id)}: ${b.streak} in a row · ${game.icon} ${game.name}</span>
        <p class="kick-tally">${tally}</p>
        <p style="font-weight:800">${b.points == null ? 'Playing for bonus points…' : `+${b.points} bonus point${b.points === 1 ? '' : 's'}`}</p>
      </div>`;
    }

    // A 1v1 challenge: the dare, the duel as it happens, or the result.
    function challengeView(g) {
      const c = g.challenge;
      if (!c) return '';
      const a = nameOf(g, c.challenger_id);
      const b = nameOf(g, c.opponent_id);
      const kind = c.mode === 'game' ? `${gameOf(c.minigame).icon} ${gameOf(c.minigame).name} face-off` : '🔔 Buzzer race';
      if (c.status === 'pending') return `<p class="notice">⚔️ ${a} challenges ${b} to a ${kind.toLowerCase()}!</p>`;
      if (c.status === 'refused') return `<p class="notice">🐔 ${b} chickened out of ${a}'s challenge and loses 1 point.</p>`;
      const score = (id) => c.mode === 'game'
        ? (c.scores[id] == null ? '<span class="muted">playing…</span>' : `<span class="duel-score">${c.scores[id]}</span>`)
        : `<span class="kick-tally">${c.rounds.map((r) => r.winner === id ? '🏆' : r.resolved ? '✗' : '○').join(' ')}</span>`;
      const w = c.winner_id && nameOf(g, c.winner_id);
      return `<div class="card stack duel-card" style="gap:6px">
        <span class="eyebrow">⚔️ ${kind}</span>
        <div class="duel-vs">
          <div><span class="player-name">${a}</span>${score(c.challenger_id)}</div>
          <span class="duel-x" aria-hidden="true">VS</span>
          <div><span class="player-name">${b}</span>${score(c.opponent_id)}</div>
        </div>
        ${c.status === 'finished' ? `<p style="font-weight:800">${w ? `${w} wins and steals 2 points!` : "It's a draw."}</p>` : ''}
      </div>`;
    }

    function view(g) {
      if (!g) return '<div class="pass"><h1>This game can\'t be watched</h1><p style="font-weight:700">The link may be wrong, or watching has been turned off for this game.</p></div>';
      const head = `<div class="topbar"><span class="eyebrow">Watching game ${esc(g.code)}</span><span class="chip" style="background:var(--card)">Live</span></div>`;
      if (g.status === 'lobby') {
        return `${head}<div class="pass"><h1>Starting soon</h1><p style="font-weight:700">${g.players.length} player${g.players.length === 1 ? '' : 's'} in the lobby.</p></div>${scoreboard(g.players)}`;
      }
      if (g.status === 'finished') {
        return `${head}<h1 class="sticker" style="background:var(--cyan);font-size:36px;transform:rotate(-2deg);align-self:flex-start">FINAL SCORES</h1>${scoreboard(g.players)}`;
      }
      const q = g.question;
      const who = q && g.players.find((p) => p.id === q.player_id);
      return `${head}
        ${q ? `
          <p style="font-family:var(--display);font-size:22px">Q${q.seq} <span class="muted" style="font-family:var(--body);font-weight:700;font-size:16px">· ${esc(q.topic)}${who ? ` · for ${esc(who.name)}` : ''}</span></p>
          <h1 class="question">${esc(q.text)}</h1>
          ${q.media_url ? `<div class="pic"><img src="${esc(q.media_url)}" alt="" style="${q.revealed ? '' : 'filter:blur(14px)'}"></div>` : ''}
          ${q.revealed ? `<div class="card stack" style="gap:4px"><span class="eyebrow">Answer</span><span class="answer-reveal">${esc(q.answer)}</span></div>` : ''}
        ` : ''}
        ${challengeView(g)}
        ${bonusView(g)}
        <h2 class="eyebrow" style="font-family:var(--body)">Scores</h2>
        ${scoreboard(g.players, q && q.player_id)}`;
    }

    let last = '';
    async function update() {
      try {
        const html = view(await watchGame());
        if (html !== last) { app.innerHTML = html; last = html; }
      } catch {
        if (!last) app.innerHTML = '<div class="pass"><h1>Can\'t reach the game</h1><p style="font-weight:700">Trying again…</p></div>';
      }
    }

    update();
    setInterval(update, WATCH_POLL_MS);
  </script>
</body>
</html>
